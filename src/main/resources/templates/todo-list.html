<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo App</title>
<!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"-->
<!--          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">-->
<!--    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
<div class="flex flex-col max-w-[800px]  mx-auto bg-blue-200 rounded-2xl p-5 min-h-[500px] mt-5">
    <h1 class="text-blue-950 font-bold text-4xl py-2">Todo App</h1>
    <p class="text-blue-950 text-2xl ">Keep track of your task schedules</p>

    <div class="group py-4" >
        <a class="my-3 bg-blue-600 text-white px-4 py-2 rounded-md group-hover:bg-blue-700 text-center w-full font-bold" th:href="@{/todos/addTask}">Add Task</a> </div>

    <!--<span th:text="${tasks}"></span>-->
    <p class="text-center py-3  font-bold">Task Schedule</p>

    <table class="items-center">
        <thead class="bg-blue-900 text-white p-4">
        <tr class="h-10 font-light">
            <th>Title</th>
            <th>Description</th>
            <th>Status</th>
            <th>Created At</th>
            <th>Updated At</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>
        <tr class="py-2 my-3" th:each="task : ${tasks}">
<!--            <td type="hidden" th:text="${task.id()}"></td>-->
            <td class="py-2 my-2 bg-gray-200" th:text="${task.title()}"></td>
            <td class="py-2 my-2 bg-gray-200" th:text="${task.description()}"></td>
            <td class="py-2 my-2 bg-gray-200" th:text="${task.status()}"></td>
            <td class="py-2 my-2 bg-gray-200" th:text="${task.createdAt()}"></td>
            <td class="py-2 my-2 bg-gray-200" th:text="${task.updatedAt()}"></td>
            <td class="py-2 my-2 bg-gray-200"><a class=" bg-blue-600 text-white rounded-md group-hover:bg-blue-700 text-center font-light px-4 py-1"
                   th:href="@{/todos/changeStatus(id=${task.id})}">Update</a>
                <a class="my-3 bg-red-700 text-white px-4 py-1 rounded-md  text-center w-full font-light"
                   th:href="@{/todos/delete(id=${task.id})}">Delete</a> </td>
        </tr>

        </tbody>

    </table>
</div>

</body>
</html>
