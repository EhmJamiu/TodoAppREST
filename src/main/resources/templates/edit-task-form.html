<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Task</title>
<!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"-->
<!--          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">-->
<!--    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">-->

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
<div class="flex flex-col pt-10 max-w-[600px]  mx-auto bg-blue-200 rounded-2xl p-5 min-h-[500px] mt-5">
    <h1 class="text-blue-950 font-bold text-2xl py-2">Edit Task</h1>
    <p class="text-blue-950 ">Amend task of your schedule.</p>

    <br>

    <form action="#" th:action="@{/todos/saveEdit}" th:object="${task}" method="post" class="bg-blue-100 mx-5 p-5 rounded-2xl">
        <input type="hidden" th:field="*{id}" />
        <label class="" for="title">Title:</label> <br>
        <input class="outline-1 my-2 w-full rounded-b p-2 bg-white" type="text" id="title" th:field="*{title}" required>
        <br> <br>
        <label  for="description">Description:</label> <br>
        <input class="outline-1 my-2 w-full rounded-b p-2 bg-white" type="text" id="description" th:field="*{description}" required>
        <br>
        <button class="my-3 bg-blue-900  hover:bg-blue-800 hover:outline-blue-900 outline-1 text-white px-4 py-2 rounded-full group-hover:bg-blue-700 text-center w-full font-bold " type="submit">Update Task</button>
    </form>
</div>

<!--<span th:text="${tasks}"></span>-->

</body>
</html>
